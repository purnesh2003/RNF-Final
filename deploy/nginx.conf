# WebSocket-aware reverse proxy for the local Docker stack.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# Keep the HTTPS scheme reported by whatever sits in front of nginx (Cloudflare Tunnel, CloudFront, a load balancer).
# Socket.IO compares the browser's Origin (https://...) with the scheme it sees, so this must not be forced to http.
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }

# ip_hash keeps one browser on one app container, which Socket.IO long-polling fallback needs.
# Messages still reach everyone because both containers share Redis.
upstream app { ip_hash; server web1:8000; server web2:8000; }

server {
  listen 80;
  client_max_body_size 51m;
  location / {
    proxy_pass http://app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # $http_host keeps the :8080 port, so Socket.IO's same-origin check matches the browser's Origin header.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}
