name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: community
          POSTGRES_PASSWORD: community
          POSTGRES_DB: community
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U community -d community"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      APP_ENV: testing
      SECRET_KEY: test-secret
      DATABASE_URL: postgresql://community:community@localhost:5432/community
      REDIS_URL: redis://localhost:6379/0
      RATELIMIT_ENABLED: "0"
      WTF_CSRF_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app migrations wsgi.py
      - run: pytest -q
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
