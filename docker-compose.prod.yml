# Single-server production stack: Caddy (automatic HTTPS) + app + PostgreSQL + Redis.
# Run:  docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: community
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: community
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    restart: always

  web:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: always
    env_file: [.env]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://community:${DB_PASSWORD}@db:5432/community
      REDIS_URL: redis://redis:6379/0
      TRUST_PROXY: "1"
      COOKIE_SECURE: "1"
      CORS_ORIGINS: https://${DOMAIN}
      TRUSTED_HOSTS: ${DOMAIN}
      ADMIN_FORCE_CHANGE: "1"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    command: sh -c "flask db upgrade && flask ensure-admin && gunicorn -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 --worker-connections 3000 -b 0.0.0.0:8000 --timeout 120 wsgi:app"
    volumes: [uploads:/srv/uploads]

  caddy:
    image: caddy:2
    restart: always
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]

volumes:
  pgdata:
  uploads:
  caddy_data:
