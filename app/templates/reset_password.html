{% extends "base.html" %}
{% block title %}Set a new password · {{ site_name }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Set a new password</h1>
    <p class="auth-sub">Choose a strong password you have not used before.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label" for="password">New password</label>
        <input id="password" type="password" name="password" class="form-control" minlength="12" pattern="{{ pw_pattern }}" title="{{ pw_hint }}" autocomplete="new-password" required autofocus>
        <div class="form-text">{{ pw_hint }}</div></div>
      <div class="mb-4"><label class="form-label" for="confirm">Confirm password</label>
        <input id="confirm" type="password" name="confirm" class="form-control" minlength="12" autocomplete="new-password" required></div>
      <button class="btn btn-brand w-100 btn-lg">Reset password</button>
    </form>

  </div>
</div>
{% endblock %}
