# Local production-like stack: docker compose up --build
# One migration job runs first; both web containers start only after it succeeds.
services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: community, POSTGRES_PASSWORD: community, POSTGRES_DB: community}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community -d community"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  migrate:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://community:community@db:5432/community
      REDIS_URL: redis://redis:6379/0
      TRUST_PROXY: "1"
      COOKIE_SECURE: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "flask db upgrade && flask ensure-admin"

  web1: &web
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://community:community@db:5432/community
      REDIS_URL: redis://redis:6379/0
      TRUST_PROXY: "1"
      COOKIE_SECURE: "0"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: gunicorn -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 --worker-connections 3000 -b 0.0.0.0:8000 --timeout 120 --graceful-timeout 30 wsgi:app
    volumes: [uploads:/srv/uploads]

  web2:
    <<: *web
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27
    ports: ["8080:80"]
    depends_on:
      web1:
        condition: service_healthy
      web2:
        condition: service_healthy
    volumes: [./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro]

volumes:
  pgdata:
  uploads:
